[project]
name = "choonclips"
version = "0.1.0"
description = "Local clipping studio: turn long videos into vertical short clips and auto-post them to TikTok, Instagram Reels, YouTube Shorts and X."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Speech-to-text with word timestamps (strongly recommended: needed for captions and transcript-based clip picking)
transcribe = ["faster-whisper>=1.0"]
# Face-aware 9:16 reframing (otherwise clips use a blurred-background fit)
reframe = ["opencv-python-headless>=4.9,<5"]
# Claude picks and writes up the clips (otherwise a local heuristic scorer is used)
ai = ["anthropic>=0.70"]
# Import from YouTube / other URLs
url = ["yt-dlp>=2024.1.1"]
all = ["choonclips[transcribe,reframe,ai,url]"]
dev = ["pytest>=8"]

[project.scripts]
choonclips = "choonclips.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["choonclips*"]

[tool.setuptools.package-data]
choonclips = ["static/*"]
